<!doctype html>
<!-- Experiment 2: Web Awesome's default styles applied to our own app-markdown.
     No ECharts here -- the question is purely what WA's typography looks like.

     The load-bearing decision: app-markdown renders into the LIGHT DOM, not a
     shadow root. `wa-prose` is a container class that styles its descendants,
     and page CSS does not cross a shadow boundary, so a shadow-rooted component
     would show none of it. Web Awesome's own <wa-markdown> renders light for
     exactly this reason. Consequence: Lit only adopts `static styles` into a
     shadow root, so this component has none -- WA supplies all of it.

     We use our component rather than <wa-markdown> because theirs reads its
     input from a child <script type="text/markdown">, and we want `content` to
     arrive as a property so this can be server-rendered later.

     Needs a local server; Chrome refuses module scripts over file://. -->
<html lang="en" class="wa-theme-default wa-palette-default wa-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Awesome + Markdown</title>

<!-- theme + utility classes + native reset, in one file -->
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.11.0/styles/webawesome.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.11.0/webawesome.loader.js"></script>

<script type="importmap">
{
  "imports": {
    "lit": "https://esm.sh/lit@3.3.3",
    "lit/": "https://esm.sh/lit@3.3.3/",
    "marked": "https://esm.sh/marked@15.0.12"
  }
}
</script>

<style>
  html, body { min-height: 100%; padding: 0; margin: 0; }

  wa-page { --menu-width: 16rem; }
  wa-page[view='mobile'] { --menu-width: auto; }

  /* An unknown element defaults to display:inline, and the :host rule that
     used to fix that lived in the shadow styles we no longer have. */
  app-markdown { display: block; }

  /* Multiplies every margin in the prose rhythm; type sizes are untouched.
     Below 1 tightens, above loosens. */
  .wa-prose { --wa-prose-rhythm-scale: 0.65; }
</style>
</head>
<body>

<wa-page>
  <header slot="header" class="wa-split">
    <strong>Web Awesome + Markdown</strong>
    <wa-button id="scheme" appearance="plain" aria-label="Toggle dark mode">
      <wa-icon name="moon"></wa-icon>
    </wa-button>
  </header>

  <!-- Written once. Sidebar on desktop, drawer on mobile, both handled by wa-page. -->
  <nav slot="navigation" class="wa-stack wa-gap-2xs">
    <a href="#headings" data-drawer="close">Headings</a>
    <a href="#body-copy" data-drawer="close">Body copy</a>
    <a href="#lists" data-drawer="close">Lists</a>
    <a href="#a-table" data-drawer="close">A table</a>
    <a href="#quotes-and-rules" data-drawer="close">Quotes and rules</a>
    <a href="#code" data-drawer="close">Code</a>
  </nav>

  <!-- wa-page's default main padding is right for a single contained column,
       so it stays. Full-bleed sections would want main { padding: 0 }. -->
  <main>
    <article class="wa-prose">
      <app-markdown></app-markdown>
    </article>
  </main>

  <footer slot="footer">
    <small>Experiment 2 &middot; lit + marked + Web Awesome</small>
  </footer>
</wa-page>

<script type="module">
import { LitElement, html } from 'lit';
import { unsafeHTML } from 'lit/directives/unsafe-html.js';
import { Marked } from 'marked';

// --- marked setup ------------------------------------------------- //
// marked v15 stopped adding ids to headings, so sidebar anchors would all be
// dead links. Same interception mechanism as experiment 1's echarts fence,
// pointed at a different token.

function createMarkedParser() {
  const marked = new Marked();
  marked.use({
    renderer: {
      // A shorthand method, not an arrow, so `this` is the renderer and
      // `this.parser` exists.
      heading({ tokens, depth }) {
        const text = this.parser.parseInline(tokens);
        const id = text
          .replace(/<[^>]+>/g, '')       // inline markup, e.g. <code> in a heading
          .toLowerCase()
          .replace(/[^\w]+/g, '-')
          .replace(/^-+|-+$/g, '');
        return `<h${depth} id="${id}">${text}</h${depth}>\n`;
      },
    },
  });
  return marked;
}
const markdownParser = createMarkedParser();

// --- <app-markdown> ----------------------------------------------- //

class AppMarkdown extends LitElement {
  static properties = { content: { type: String } };

  // Render into the light DOM so wa-prose's descendant selectors reach the
  // generated headings, lists and tables. Nothing else about the component
  // changes: content still arrives as a property and render() is still
  // synchronous, which is what keeps a server render on the table.
  createRenderRoot() { return this; }

  constructor() {
    super();
    this.content = '';
  }

  render() {
    if (!this.content) return html``;
    return html`${unsafeHTML(markdownParser.parse(this.content))}`;
  }
}
customElements.define('app-markdown', AppMarkdown);

// --- color scheme toggle ------------------------------------------ //
// WA uses explicit classes rather than prefers-color-scheme, so the page owns
// the decision.

const root = document.documentElement;
document.getElementById('scheme').addEventListener('click', (e) => {
  const dark = root.classList.toggle('wa-dark');
  root.classList.toggle('wa-light', !dark);
  e.currentTarget.querySelector('wa-icon').name = dark ? 'sun' : 'moon';
});

// --- the demo document -------------------------------------------- //
// A kitchen sink, because the point is judging typography: every block
// wa-prose styles should appear at least once. Fences are escaped as \`
// only because this lives in a template literal.

const DOC = `
# Reading a Markdown Page

This page exists to answer one question: what do Web Awesome's defaults do to
ordinary markdown, with no styling of our own anywhere in the path? Everything
below is plain \`marked\` output sitting inside \`wa-prose\`.

## Headings

The heading scale is what \`wa-prose\` is really for -- it sets sizes in \`em\`
along with an asymmetric vertical rhythm, so space above a heading is larger
than the space below it, and headings bind to the text they introduce.

### A third-level heading

Deep enough to show the scale stepping down without becoming indistinguishable
from body copy.

#### A fourth-level heading

The last level that usually earns its place in a document.

## Body copy

Paragraphs get a reading column capped near 65 characters, which is the band
where the eye tracks reliably from the end of one line to the start of the
next. Long paragraphs are where that constraint either proves itself or starts
to feel arbitrary, so here is one long enough to judge: the measure only
matters once a line is long enough that returning to the left margin requires
the reader to find their place again, which is the failure mode a reading
column exists to prevent.

Inline styling is **bold**, *italic*, \`inline code\`, and
[a link](https://webawesome.com/docs). Inline code inside a sentence is the
detail most likely to look wrong, because it has to sit inside the line without
disturbing its rhythm.

## Lists

Unordered, with nesting:

- A first item, short.
- A second item long enough to wrap onto a second line, so the hanging indent
  and the spacing between items are both visible.
  - A nested item.
  - Another nested item.
    - One level deeper than anyone should go.
- A third item.

Ordered:

1. Load the theme and the loader from the CDN.
2. Put the markdown component in the light DOM.
3. Wrap it in \`wa-prose\`.
4. Change nothing else.

## A table

| Element | Comes from | Styled by |
| --- | --- | --- |
| Headings | marked | wa-prose |
| Paragraphs | marked | wa-prose |
| Sidebar | wa-page | Web Awesome |
| Theme | webawesome.css | Web Awesome |
| Markdown parsing | our component | nothing |

Tables are the block most likely to look unfinished in a type system, since
they need borders, padding and alignment that prose rules do not otherwise
supply.

## Quotes and rules

> A blockquote, which should read as set apart from the body without shouting.
> Two lines, so the internal leading is visible as well as the indent.

---

A horizontal rule above, separating sections without a heading.

## Code

A fenced block, which is where a prose style either has a considered
monospace treatment or obviously does not:

\`\`\`js
class AppMarkdown extends LitElement {
  createRenderRoot() { return this; }   // light DOM, so wa-prose reaches in

  render() {
    return html\`\${unsafeHTML(markdownParser.parse(this.content))}\`;
  }
}
\`\`\`

And a last paragraph, so the final block is not a code fence.
`;

document.querySelector('app-markdown').content = DOC;
</script>

</body>
</html>
