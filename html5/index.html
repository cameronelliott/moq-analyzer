<!doctype html>
<html lang="en" class="wa-theme-default wa-palette-default">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Picks light or dark before first paint, so a dark page never flashes
    // light. applyScheme in lib/dark-light-scheme.ts has the same rule; keep in step.
    (function () {
      var pref;
      try { pref = localStorage.getItem('scheme'); } catch (e) {}
      var dark = pref === 'dark'
        || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.add(dark ? 'wa-dark' : 'wa-light');
    })();
  </script>
  <title>MoQ Analyzer</title>
  <link rel="stylesheet" href="./app.css">
  <script type="module" src="./app.ts"></script>
</head>
<body>
<wa-page mobile-breakpoint="920">
  <header slot="header" class="wa-split">
    <a class="site-name" href="./">MoQ Analyzer</a>
    <fieldset id="scheme-switch" class="scheme-switch">
      <legend class="wa-visually-hidden">Color scheme</legend>
      <label id="scheme-light"><input class="wa-visually-hidden" type="radio" name="scheme" value="light"><wa-icon name="sun" label="Light"></wa-icon></label>
      <label id="scheme-dark"><input class="wa-visually-hidden" type="radio" name="scheme" value="dark"><wa-icon name="moon" label="Dark"></wa-icon></label>
      <label id="scheme-auto"><input class="wa-visually-hidden" type="radio" name="scheme" value="auto" checked><wa-icon name="circle-half-stroke" label="Auto"></wa-icon></label>
      <wa-tooltip for="scheme-light">Light</wa-tooltip>
      <wa-tooltip for="scheme-dark">Dark</wa-tooltip>
      <wa-tooltip for="scheme-auto">Auto: follows your system</wa-tooltip>
    </fieldset>
  </header>

  <nav slot="navigation" class="wa-stack wa-gap-xs">
    <a href="#load" data-drawer="close">Load files</a>
    <div id="capture-nav" class="wa-stack wa-gap-xs" hidden>
      <span class="wa-caption-s">Capture</span>
      <a href="#overview" data-drawer="close">Overview</a>
      <a href="#latency" data-drawer="close">Latency</a>
      <a href="#throughput" data-drawer="close">Bitrate</a>
      <a href="#interarrival" data-drawer="close">Interarrival</a>
      <a href="#jitter" data-drawer="close">Jitter</a>
      <a href="#relay" data-drawer="close">Relay</a>
      <a href="#connections" data-drawer="close">Connections</a>
    </div>
  </nav>

  <main>
    <p id="status" role="status"></p>
    <!-- Shown during a load, twice over: how much of the files mlog-sql has
         read, then how far the queries that fill the pages have come. -->
    <progress id="load-bar" class="load-bar" max="1" value="0" hidden></progress>

    <!-- One view shows at a time; the URL hash picks it. -->
    <section data-view="load">
      <label id="drop-zone" class="drop-zone wa-stack wa-gap-xs">
        <strong>Drop mlog files here, or pick them.</strong>
        <input id="file-input" type="file" multiple accept=".mlog,.gz">
        <span class="quiet">Names look like <code>&lt;cid&gt;_client.mlog.gz</code> or <code>&lt;cid&gt;_server.mlog</code>.</span>
      </label>
      <!-- How far along the duckdb engine is: it downloads and starts while
           the reader picks files. lib/engine-download.ts has the text. -->
      <p id="engine" class="engine quiet">
        <span id="engine-text"></span>
        <progress id="engine-bar" max="1" hidden></progress>
      </p>
      <ul id="rejected" class="quiet"></ul>
      <!-- app.ts adds one button per sample capture in lib/showcase.ts. -->
      <div id="showcases" class="showcases wa-stack wa-gap-m">
        <strong>Or load a sample capture.</strong>
      </div>
    </section>

    <section data-view="overview" id="overview" hidden></section>

    <section data-view="latency" hidden>
      <article id="latency" class="wa-prose"></article>
    </section>

    <section data-view="throughput" hidden>
      <article id="throughput" class="wa-prose"></article>
    </section>

    <section data-view="interarrival" hidden>
      <article id="interarrival" class="wa-prose"></article>
    </section>

    <section data-view="jitter" hidden>
      <article id="jitter" class="wa-prose"></article>
    </section>

    <section data-view="relay" hidden>
      <article id="relay" class="wa-prose"></article>
    </section>

    <section data-view="connections" hidden>
      <article id="connections" class="wa-prose"></article>
    </section>
  </main>
</wa-page>
</body>
</html>
